<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>{% if post.title %}{{ post.title }} | {{ page.title }}{% else %}{{ site.title }}{% endif %}</title>

<link rel="stylesheet" href="{{ site.baseurl }}/node_modules/reveal.js/css/reveal.css">

<link rel="stylesheet" href="{{site.baseurl}}/node_modules/reveal.js/css/reset.css">
<link rel="stylesheet" href="{{site.baseurl}}/node_modules/reveal.js/css/reveal.css">
<link rel="stylesheet" href="{{site.baseurl}}/node_modules/reveal.js/css/theme/moon.css">

<!-- Deck tweaks: smaller headings and text so every slide fits -->
<style>
  .reveal { font-size: 32px; }
  .reveal .slides section h1 { font-size: 2.2em; margin-bottom: 0.5em; }
  .reveal .slides section h3 { font-size: 1.2em; }
  .reveal .slides section blockquote { width: 85%; font-size: 0.9em; }
  .reveal .slides section ul, .reveal .slides section ol { margin-bottom: 0.6em; }
  .reveal .slides section.dense { font-size: 0.8em; }
  .reveal .slides section.dense h1 { font-size: 2.2em; }
  .reveal .slides section pre { width: 100%; font-size: 0.72em; }
  .reveal .slides section pre code { max-height: none; padding: 0.6em 0.8em; white-space: pre-wrap; }
  .reveal .slides section pre.plain code { background: #073642; color: #eee8d5; }
</style>

<!-- Theme used for syntax highlighting of code -->
<link rel="stylesheet" href="{{site.baseurl}}/node_modules/reveal.js/lib/css/monokai.css">

<!-- Printing and PDF exports -->
<script>
	var link = document.createElement( 'link' );
	link.rel = 'stylesheet';
	link.type = 'text/css';
	link.href = window.location.search.match( /print-pdf/gi ) ? 'css/print/pdf.css' : 'node_modules/reveal.js/css/print/paper.css';
	document.getElementsByTagName( 'head' )[0].appendChild( link );
</script>
